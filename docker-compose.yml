version: "3.9"

services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d

  orchestrator:
    build: ./orchestrator
    container_name: ai_orchestrator
    restart: unless-stopped
    environment:
      PORT: 3001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CHOKIDAR_USEPOLLING: true
    ports:
      - "3001:3001"
    volumes:
      - ./orchestrator/src:/app/src
      - ./orchestrator/package.json:/app/package.json
      - ./orchestrator/tsconfig.json:/app/tsconfig.json
    command: npm run dev

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    container_name: nest_backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: mydb
      CHOKIDAR_USEPOLLING: true
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PUZZLE_POPULATION_CRON: ${PUZZLE_POPULATION_CRON:-0 6 * * *}
      PUZZLE_POPULATION_TZ: ${PUZZLE_POPULATION_TZ:-UTC}
    ports:
      - "4000:4000"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
      - ./backend/tsconfig.json:/app/tsconfig.json
    command: npm run start:dev

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      # Bind mount source for hot reload
      - ./frontend:/app
      # Anonymous volume prevents the container's node_modules
      # (built for Linux) from being clobbered by your host's
      # node_modules (possibly built for Mac/Windows)
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:4000
      # Needed for HMR file watching to work reliably in Docker
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

  worker:
    build: ./backend
    container_name: strategy_worker
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: mydb
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      PUZZLE_POPULATION_CRON: ${PUZZLE_POPULATION_CRON:-0 6 * * *}
      PUZZLE_POPULATION_TZ: ${PUZZLE_POPULATION_TZ:-UTC}
    depends_on:
      - db
      - redis
      - orchestrator
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
      - ./backend/tsconfig.json:/app/tsconfig.json
    command: npx tsx src/worker.ts

volumes:
  postgres_data:
  redis_data:
