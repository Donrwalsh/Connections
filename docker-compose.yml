services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mydb}",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  orchestrator:
    build:
      context: ./orchestrator
      target: build
    container_name: ai_orchestrator
    restart: unless-stopped
    environment:
      PORT: 3001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-openai}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-nano}
      MODEL_CONTEXT_WINDOW: ${MODEL_CONTEXT_WINDOW:-8192}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      CHOKIDAR_USEPOLLING: true
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "3001:3001"
    volumes:
      - ./orchestrator/src:/app/src
      - ./orchestrator/package.json:/app/package.json
      - ./orchestrator/tsconfig.json:/app/tsconfig.json
    command: npm run dev
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3001/health',{headers:{'x-internal-api-key':process.env.INTERNAL_API_KEY}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    # Persist jobs across restarts and cap memory. allkeys-lru is safe here
    # because this Redis instance only brokers BullMQ queues, whose data is
    # regenerable — without a bound it can grow unbounded under heavy
    # strategy-run loads.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      target: build
    container_name: nest_backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-mydb}
      CHOKIDAR_USEPOLLING: true
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      ORCHESTRATOR_URL: http://orchestrator:3001
      ORCHESTRATOR_TIMEOUT_MS: ${ORCHESTRATOR_TIMEOUT_MS:-120000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      BULL_BOARD_USER: ${BULL_BOARD_USER:-admin}
      BULL_BOARD_PASS: ${BULL_BOARD_PASS:-bullboard}
      PUZZLE_POPULATION_CRON: ${PUZZLE_POPULATION_CRON:-0 6 * * *}
      PUZZLE_POPULATION_TZ: ${PUZZLE_POPULATION_TZ:-UTC}
      SHUFFLE_TRIALS: ${SHUFFLE_TRIALS:-3}
      LLM_TRIALS_PER_MODEL: ${LLM_TRIALS_PER_MODEL:-3}
      LLM_MAX_DUPLICATE_GUESSES: ${LLM_MAX_DUPLICATE_GUESSES:-10}
      LLM_MAX_MALFORMED_RESPONSES: ${LLM_MAX_MALFORMED_RESPONSES:-3}
      LLM_MAX_MODEL_ERRORS: ${LLM_MAX_MODEL_ERRORS:-5}
      LLM_MAX_PROMPTS: ${LLM_MAX_PROMPTS:-19}
      LLM_NUM_RESPONSES: ${LLM_NUM_RESPONSES:-1}
      LLM_TEMPERATURE_BASE: ${LLM_TEMPERATURE_BASE:-0.2}
      LLM_OPENAI_CONCURRENCY: ${LLM_OPENAI_CONCURRENCY:-1}
      LLM_OLLAMA_CONCURRENCY: ${LLM_OLLAMA_CONCURRENCY:-1}
      PUZZLE_CACHE_DIR: ${PUZZLE_CACHE_DIR:-/app/.puzzle-cache}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
      - ./backend/tsconfig.json:/app/tsconfig.json
      - ./.puzzle-cache:/app/.puzzle-cache
    command: npm run start:dev
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      # Bind mount source for hot reload
      - ./frontend:/app
      # Anonymous volume prevents the container's node_modules
      # (built for Linux) from being clobbered by your host's
      # node_modules (possibly built for Mac/Windows)
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:4000
      # Needed for HMR file watching to work reliably in Docker
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

  worker:
    build: ./backend
    container_name: strategy_worker
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-mydb}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      ORCHESTRATOR_TIMEOUT_MS: ${ORCHESTRATOR_TIMEOUT_MS:-120000}
      PUZZLE_POPULATION_CRON: ${PUZZLE_POPULATION_CRON:-0 6 * * *}
      PUZZLE_POPULATION_TZ: ${PUZZLE_POPULATION_TZ:-UTC}
      SHUFFLE_TRIALS: ${SHUFFLE_TRIALS:-3}
      LLM_TRIALS_PER_MODEL: ${LLM_TRIALS_PER_MODEL:-3}
      LLM_MAX_DUPLICATE_GUESSES: ${LLM_MAX_DUPLICATE_GUESSES:-10}
      LLM_MAX_MALFORMED_RESPONSES: ${LLM_MAX_MALFORMED_RESPONSES:-3}
      LLM_MAX_MODEL_ERRORS: ${LLM_MAX_MODEL_ERRORS:-5}
      LLM_MAX_PROMPTS: ${LLM_MAX_PROMPTS:-19}
      LLM_NUM_RESPONSES: ${LLM_NUM_RESPONSES:-1}
      LLM_TEMPERATURE_BASE: ${LLM_TEMPERATURE_BASE:-0.2}
      LLM_OPENAI_CONCURRENCY: ${LLM_OPENAI_CONCURRENCY:-1}
      LLM_OLLAMA_CONCURRENCY: ${LLM_OLLAMA_CONCURRENCY:-1}
      PUZZLE_CACHE_DIR: ${PUZZLE_CACHE_DIR:-/app/.puzzle-cache}
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      orchestrator:
        condition: service_started
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
      - ./backend/tsconfig.json:/app/tsconfig.json
      - ./.puzzle-cache:/app/.puzzle-cache
    command: npx tsx --watch src/worker.ts
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const R=require('ioredis');const r=new R({host:'redis',port:6379,retryStrategy:()=>null});r.ping().then(()=>process.exit(0)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 60s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  ollama_data:
