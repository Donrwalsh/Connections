version: "3.9"

services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d

  backend:
    build: ./backend
    container_name: nest_backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: mydb
      CHOKIDAR_USEPOLLING: true
    ports:
      - "4000:4000"
    depends_on:
      - db
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
      - ./backend/tsconfig.json:/app/tsconfig.json
    command: npm run start:dev

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      # Bind mount source for hot reload
      - ./frontend:/app
      # Anonymous volume prevents the container's node_modules
      # (built for Linux) from being clobbered by your host's
      # node_modules (possibly built for Mac/Windows)
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:4000
      # Needed for HMR file watching to work reliably in Docker
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

volumes:
  postgres_data:
