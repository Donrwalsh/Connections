name: Backend CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Lint, Build, and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: connections_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d connections_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build answer-grammar
        run: npm run build --workspace=packages/answer-grammar

      - name: Lint
        working-directory: ./backend
        run: npm run lint

      - name: Type-check and build
        working-directory: ./backend
        run: npm run build

      - name: Run unit tests
        working-directory: ./backend
        run: npm run test

      - name: Run end-to-end tests
        working-directory: ./backend
        run: npm run test:e2e
