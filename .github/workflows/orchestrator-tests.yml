name: Orchestrator CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  orchestrator:
    name: Type-check, Build, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build answer-grammar
        run: npm run build --workspace=packages/answer-grammar

      - name: Test answer-grammar
        run: npm run test:run --workspace=packages/answer-grammar

      - name: Type-check
        working-directory: ./orchestrator
        run: npm run typecheck

      - name: Build
        working-directory: ./orchestrator
        run: npm run build

      - name: Run tests
        working-directory: ./orchestrator
        run: npm run test:run
